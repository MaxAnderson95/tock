name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate annotated SemVer tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          # The checkout does not keep the tag object, so ask GitHub whether the ref points at one.
          if [[ "$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" --jq .object.type)" != tag ]]; then
            echo "::error::Tag is not annotated: $TAG"
            exit 1
          fi
          version="${TAG#v}"
          number='(0|[1-9][0-9]*)'
          identifier='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          semver="^${number}\.${number}\.${number}(-${identifier}(\.${identifier})*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$"
          if [[ ! "$version" =~ $semver ]]; then
            echo "::error::Tag is not valid SemVer: $TAG"
            exit 1
          fi
          echo "version=${version%%[-+]*}" >> "$GITHUB_OUTPUT"
          if [[ "${version%%+*}" == *-* ]]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build app
        run: |
          swift --version
          bash scripts/build-app.sh

      - name: Package app
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" build/Tock.app/Contents/Info.plist
          codesign --force --sign - build/Tock.app
          codesign --verify --deep --strict build/Tock.app
          ditto -c -k --sequesterRsrc --keepParent build/Tock.app "build/Tock-${TAG}-macos-arm64.zip"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tock-macos-arm64
          path: build/Tock-*-macos-arm64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tock-macos-arm64
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        shell: bash
        run: |
          args=(--verify-tag --generate-notes --title "$TAG")
          if [[ "$PRERELEASE" == true ]]; then
            args+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" "dist/Tock-${TAG}-macos-arm64.zip" "${args[@]}"
